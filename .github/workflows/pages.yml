name: pages
on:
  workflow_run: {workflows: [build], types: [completed], branches: [main, master]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: art, run-id: "${{ github.event.workflow_run.id }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Copy binaries next to the manifests (one origin)
        run: |
          mkdir -p site && cp -r web/* site/
          for cpu in esp32 esp32s3 esp32c6; do
            mkdir -p site/fw/$cpu && cp art/firmware-$cpu/*.bin site/fw/$cpu/ || true
          done
          python3 web/make_manifests.py site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
