name: build
on:
  push: {branches: [main, master]}
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cryptography
      - run: scripts/test-host.sh tools
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-host.sh rust
  firmware:
    needs: host-tests
    runs-on: ubuntu-latest
    # Same image as the local Dockerfile (docker.io/espressif/idf:v6.0.2). Push
    # the project image to ghcr.io later and point both at it.
    container: espressif/idf:v6.0.2
    strategy:
      matrix:
        cpu: [esp32, esp32s3, esp32c6]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh" >/dev/null 2>&1
          scripts/build.sh ${{ matrix.cpu }} all
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.cpu }}
          path: target/out/${{ matrix.cpu }}/*.bin
  android:
    needs: host-tests
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/android-sdk:36-ndk
    steps:
      - uses: actions/checkout@v4
      - run: yes | sdkmanager "platforms;android-36.1" >/dev/null   # API 36.1: the app is compiled against it
      - run: scripts/test-host.sh android
      # Signed release APK when the keystore secrets exist (docs/building.md), else the debug APK.
      - run: scripts/android-release.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: flasher-apk
          path: target/release-apk/esp-wifi-loader.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dl}          # dl/firmware-<cpu>/*.bin
      - run: |
          mkdir rel
          for d in dl/firmware-*; do cpu=${d#dl/firmware-}; for f in "$d"/*.bin; do cp "$f" "rel/$cpu-$(basename "$f")"; done; done
          (cd rel && sha256sum *.bin > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with: {files: "rel/*"}
  # Signs the images with the release key and publishes them, with the Android app, as the rolling `latest` release,
  # which the app downloads (https://github.com/costinm/esp-wifi-loader/releases/download/latest/<chip>.wlpkg; short
  # form costinm/esp-wifi-loader:latest). Needs the repository secret WL_SIGNING_KEY (docs/building.md, "Whose key
  # signs what"). The logic is in scripts/publish-release.sh and scripts/publish-latest.sh: run them locally to test.
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [firmware, rust, android]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dl}          # dl/firmware-<cpu>/*.bin, dl/flasher-apk/esp-wifi-loader.apk
      - run: pip install cryptography
      - name: Sign and collect
        env:
          WL_SIGNING_KEY: ${{ secrets.WL_SIGNING_KEY }}
        run: |
          for d in dl/firmware-*; do mkdir -p "target/out/${d#dl/firmware-}"; cp "$d"/*.bin "target/out/${d#dl/firmware-}/"; done
          APK="$PWD/dl/flasher-apk/esp-wifi-loader.apk" scripts/publish-release.sh
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-latest.sh "$version"
